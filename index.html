</script><script id="clinic-browser-history-fix">
(function(){
  let current="home", ready=false, restoring=false;
  const targets={home:".hospital-brand",intake:"#hospital-navigation button:nth-child(1)",patient:"#hospital-navigation button:nth-child(2)",details:"#hospital-navigation button:nth-child(3)",records:"#hospital-navigation button:nth-child(4)",accuracy:"#hospital-navigation button:nth-child(5)"};
  function readTab(){
    const root=document.querySelector(".app");
    const name=root && Array.from(root.classList).find(c=>c.startsWith("workspace-"));
    return name?name.slice(10):null;
  }
  function sync(){
    const next=readTab();
    if(!next)return;
    if(!ready){
      ready=true;current=next;
      history.replaceState({...history.state,clinicTab:next},"",location.href);
      return;
    }
    if(next===current)return;
    current=next;
    if(!restoring)history.pushState({...history.state,clinicTab:next},"",location.href);
  }
  window.addEventListener("popstate",function(e){
    const target=e.state&&typeof e.state.clinicTab==="string"?e.state.clinicTab:"home";
    const button=document.querySelector(targets[target]||targets.home);
    if(button){
      restoring=true;
      current=target;
      button.click();
      setTimeout(function(){restoring=false;sync();},0);
    }
  });
  document.addEventListener("DOMContentLoaded",function(){
    new MutationObserver(sync).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:["class"]});
    sync();
  });
})();
</script>

<script id="clinic-friendly-patient-labels">
(function(){
 const shorten=function(value){return value.replace(/\s*·\s*PAT-[a-zA-Z0-9-]+/g,"")};
 let queued=false;
 function update(){
  queued=false;
  document.querySelectorAll(".patient-search-popup [role='option'],.patient-search-popup [data-slot='combobox-item']").forEach(function(el){
    const text=el.textContent||"";
    if(!/PAT-[a-zA-Z0-9-]+/.test(text))return;
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
    let node;
    while((node=walker.nextNode())){if(/PAT-[a-zA-Z0-9-]+/.test(node.nodeValue||""))node.nodeValue=shorten(node.nodeValue)}
  });
  document.querySelectorAll(".patient-type input.vaccine-input,.profile-search input.vaccine-input").forEach(function(input){
    if(/PAT-[a-zA-Z0-9-]+/.test(input.value))input.value=shorten(input.value);
  });
 }
 function schedule(){if(!queued){queued=true;requestAnimationFrame(update)}}
 document.addEventListener("DOMContentLoaded",function(){new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,characterData:true});schedule()});
})();
</script>
